[project]
name = "ventris"
version = "0.1.0"
description = "A small, readable, modern decoder-only language model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.0",
    "tokenizers==0.23.2",
    "torch>=2.9",
    "tqdm>=4.67",
    "transformers>=5.17,<6",
    "wandb>=0.19",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ventris"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
